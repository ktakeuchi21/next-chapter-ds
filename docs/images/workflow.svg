<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="968" viewBox="0 0 1000 968" role="img" aria-label="Next Chapter: capture photos and voice, understand the item, research a price, prepare listings, sell and sync, then fulfill. Automatic sale monitoring and delisting are planned.">
  <title>Next Chapter: from intake to a new home</title>
  <desc>A couch connects six illustrated steps: a photo and voice waveform, identification with a magnifier, price comparisons, reviewed listing cards, a sale and other listings closing, then a parcel or pickup truck. Listing publication is assisted. Automatic sale monitoring and delisting are planned.</desc>
