<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated marketplace form fixture</title><style>body{font:16px system-ui;max-width:600px;margin:30px auto}label{display:block;margin:16px 0}input,textarea{font:inherit;padding:8px;display:block;width:90%}img{max-width:100px;max-height:100px}</style><h1>Facebook form fixture · no network publishing</h1><p>This is a controlled test, not Facebook.</p><form><label>Title<input aria-label="Title"></label><label>Price<input aria-label="Price"></label><label>Description<textarea aria-label="Description"></textarea></label><input id="photos" type="file" accept="image/*" multiple><div id="previews"></div><button id="publish" type="button">Publish (fixture)</button></form><script>window.fixture={uploads:0,publishes:0};photos.onchange=async()=>{fixture.uploads++;fixture.files=await Promise.all([...photos.files].map(async f=>({name:f.name,type:f.type,size:f.size,bytes:[...new Uint8Array(await f.arrayBuffer())]})));previews.replaceChildren(...[...photos.files].map(f=>{const img=new Image();img.src=URL.createObjectURL(f);return img;}));};publish.onclick=()=>fixture.publishes++;</script></html>
